name: Update profile art

# Refresh the contribution heatmap AND the info card's live GitHub stats once a
# day, with zero stored secrets: the contribution calendar is scraped from the
# public profile page and the repo/follower counts come from the public API.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # This repo is named after the account, so the owner IS the username.
      GH_PROFILE_USER: ${{ github.repository_owner }}
      # Optional: raises the unauthenticated GitHub API rate limit. The token
      # is provided by Actions -- nothing to configure.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render info card
        run: |
          python scripts/make_info_card.py
          if grep -q "GitHub stats unavailable" info-card.svg; then
            echo "::warning::live stats unavailable; keeping the previous info-card.svg"
            git checkout -- info-card.svg
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data contrib-heatmap.svg info-card.svg
          if git diff --cached --quiet; then
            echo "art is already up to date"
          else
            git commit -m "chore: refresh profile art"
            git push
          fi
